id: ccstatusline
name: ccstatusline
repo: sirmalloc/ccstatusline
category: cli
tags: [statusline, ui, tokens]
summary: Customizable Claude Code status line - model, git branch, token usage, context and more, with powerline themes.
problem: The default status line shows little. ccstatusline puts model, branch, context use and cost under your prompt.
install:
  scope: user
  commands:
    - npx ccstatusline@latest
  notes: The interactive setup writes the statusLine command into your Claude Code settings.
detect:
  npm: [ccstatusline]
license: MIT
maintainer: individual
verdict: adopt
verdict_reason: Small, popular, local. Note that the status line command runs on every refresh.
scores:
  usefulness: 3
  security: 4
  maturity: 4
  cost: 5
security:
  runs_code: true
  hooks: false
  network: none
  background_process: false
  notes: Runs as your status line command, so it executes constantly with your permissions. Pin a version rather than @latest in settings.
  advisories: []
overlaps: [ccusage]
last_reviewed: "2026-10-21"
sources:
  - https://github.com/sirmalloc/ccstatusline

id: magic-ui
name: Magic UI
repo: magicuidesign/magicui
homepage: https://magicui.design
category: ui-library
tags: [react, animation, landing-page, shadcn]
summary: Free, open-source animated components and effects for React, Tailwind and Motion, installed through the shadcn CLI.
problem: Landing pages and marketing sections that need motion without building effects by hand.
install:
  scope: dependency
  commands:
    - npx shadcn@latest add <component URL from magicui.design>
  notes: Each component page gives its exact command. A paid Pro tier of templates exists alongside the free components.
license: MIT
maintainer: company
verdict: adopt
verdict_reason: Popular, MIT, copy-in model like shadcn/ui. Best on marketing pages.
scores:
  usefulness: 4
  security: 5
  maturity: 4
  cost: 5
security:
  runs_code: false
  hooks: false
  network: none
  background_process: false
  notes: Copied source into your repo.
  advisories: []
overlaps: [react-bits, kokonut-ui]
last_reviewed: "2026-10-21"
sources:
  - https://github.com/magicuidesign/magicui
  - https://magicui.design

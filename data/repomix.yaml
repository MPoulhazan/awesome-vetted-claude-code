id: repomix
name: Repomix
repo: yamadashy/repomix
homepage: https://repomix.com
category: cli
tags: [context, packing, repository, mcp]
summary: Packs a whole repository into one AI-friendly file, with token counts and secret scanning; also runs as an MCP server.
problem: Giving a chat model or another agent the full picture of a codebase. One file with structure and contents, secrets left out.
install:
  scope: one-shot
  commands:
    - npx repomix@latest
  notes: In MCP mode, run with --sandbox to confine file tools to the project. Never pack untrusted repos with an old version.
detect:
  npm: [repomix]
license: MIT
maintainer: individual
verdict: trial
verdict_reason: Very handy and actively fixed, but five advisories in 2026, including two command-execution bugs. Run 1.18.1 or later.
scores:
  usefulness: 4
  security: 3
  maturity: 4
  cost: 5
security:
  runs_code: true
  hooks: false
  network: none
  background_process: false
  data_leaves_machine: Nothing by itself - but the packed file is your whole repo, so check where you paste it.
  notes: Secret scanning via Secretlint catches known credential formats, not everything. Past bugs let a crafted repo or argument run commands.
  red_flags:
    - Five advisories in 2026; packing an untrusted repository was the main attack path.
  advisories:
    - id: GHSA-4p5g-gh74-q524
      severity: high
      summary: Packing a directory with a crafted .git runs repository-level git config helpers (gpg.program, diff.external, core.fsmonitor).
      affected: ">= 0.2.41, < 1.18.1"
      patched: 1.18.1
      published: "2026-09-21"
      url: https://github.com/yamadashy/repomix/security/advisories/GHSA-4p5g-gh74-q524
    - id: GHSA-9mm9-rqhj-j5mx
      cve: CVE-2026-49987
      severity: high
      summary: Command injection through the --remote-branch argument.
      affected: "< 1.14.1"
      patched: 1.14.1
      published: "2026-07-01"
      url: https://github.com/advisories/GHSA-9mm9-rqhj-j5mx
    - id: GHSA-hwpp-h97w-2h3j
      cve: CVE-2026-49988
      severity: moderate
      summary: attach_packed_output can bypass secret scanning on local files.
      affected: "<= 1.14.0"
      patched: 1.14.1
      published: "2026-07-01"
      url: https://github.com/advisories/GHSA-hwpp-h97w-2h3j
    - id: GHSA-w8cw-mgw9-74h7
      severity: moderate
      summary: Credentials in remote repository URLs were logged in cleartext.
      affected: "<= 1.17.0"
      patched: 1.18.0
      published: "2026-08-11"
      url: https://github.com/yamadashy/repomix/security/advisories/GHSA-w8cw-mgw9-74h7
    - id: GHSA-rpmv-562j-qxrv
      severity: low
      summary: MCP file-system tools claimed protections that were not implemented.
      affected: "<= 1.17.0"
      patched: 1.18.0
      published: "2026-08-11"
      url: https://github.com/yamadashy/repomix/security/advisories/GHSA-rpmv-562j-qxrv
overlaps: [graphify]
last_reviewed: "2026-10-21"
sources:
  - https://github.com/yamadashy/repomix
  - https://github.com/yamadashy/repomix/security/advisories

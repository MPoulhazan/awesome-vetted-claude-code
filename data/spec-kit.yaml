id: spec-kit
name: Spec Kit
repo: github/spec-kit
category: cli
tags: [spec-driven, planning, github]
summary: GitHub's toolkit for spec-driven development - constitution, spec, plan, tasks, then implementation.
problem: Vague prompts give vague code. Spec Kit makes the spec the source of truth and generates plans and task lists from it.
install:
  scope: project
  commands:
    - uv tool install specify-cli
    - specify init . --integration claude
detect:
  pypi: [specify-cli]
license: MIT
maintainer: official
verdict: adopt
verdict_reason: Maintained by GitHub, simple, agent-agnostic. The safest way into spec-driven development.
scores:
  usefulness: 4
  security: 5
  maturity: 4
  cost: 4
security:
  runs_code: true
  hooks: false
  network: none
  background_process: false
  notes: A small CLI that writes templates, commands and a few shell scripts into your project.
  advisories: []
overlaps: [bmad-method, gsd-core, superpowers]
last_reviewed: "2026-10-21"
sources:
  - https://github.com/github/spec-kit

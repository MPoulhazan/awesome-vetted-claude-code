id: kokonut-ui
name: Kokonut UI
repo: kokonut-labs/kokonutui
homepage: https://kokonutui.com
category: ui-library
tags: [react, tailwind, shadcn, motion]
summary: Polished React components built on Tailwind, shadcn/ui and Motion, copied into your project.
problem: shadcn/ui gives solid but plain building blocks. Kokonut adds ready-made, animated sections and cards in the same copy-the-code model.
install:
  scope: dependency
  commands:
    - npx shadcn@latest add <component URL from kokonutui.com>
  notes: Each component page gives its exact shadcn command. Fits any React + Tailwind project, especially one already on shadcn.
license: MIT
maintainer: company
verdict: trial
verdict_reason: Source copied into your repo, MIT, sponsored by the Vercel OSS program. Smaller community than the big kits.
scores:
  usefulness: 4
  security: 5
  maturity: 3
  cost: 5
security:
  runs_code: false
  hooks: false
  network: none
  background_process: false
  notes: The shadcn CLI copies source into your repo, so you review exactly what ships. A separate paid Pro tier exists.
  advisories: []
overlaps: [react-bits, bklit-ui]
last_reviewed: "2026-10-20"
sources:
  - https://github.com/kokonut-labs/kokonutui
  - https://kokonutui.com

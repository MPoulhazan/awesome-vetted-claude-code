id: claude-squad
name: Claude Squad
repo: smtg-ai/claude-squad
category: cli
tags: [multi-session, tmux, worktrees, tui]
summary: Terminal app that runs several Claude Code, Codex or other agents in parallel, each in its own tmux session and git worktree.
problem: Running several agents on one repo means conflicting edits and lost terminals. Each gets an isolated worktree you review and push from one screen.
install:
  scope: user
  commands:
    - brew install claude-squad
  notes: Needs tmux and git. The curl install script is also offered - read it before piping it into bash.
license: AGPL-3.0
maintainer: company
verdict: trial
verdict_reason: Simple, local, and worktrees keep agents apart. Avoid its auto-accept mode on anything you care about.
scores:
  usefulness: 4
  security: 4
  maturity: 3
  cost: 5
security:
  runs_code: true
  hooks: false
  network: none
  background_process: true
  notes: Agents keep running in background tmux sessions. The auto-yes mode accepts every permission prompt.
  red_flags:
    - Auto-accept ("yolo") mode removes your permission checks.
  advisories: []
overlaps: [vibe-kanban, opcode]
last_reviewed: "2026-10-21"
sources:
  - https://github.com/smtg-ai/claude-squad
